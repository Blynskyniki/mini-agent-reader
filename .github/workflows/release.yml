name: Release

# Builds the `mar` binary for five targets and attaches the archives to a
# GitHub Release. Triggered by pushing a tag like `v0.1.0`; can also be run
# by hand against an existing tag.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p mar-cli

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }} -p mar-cli

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          name="mar-${version}-${{ matrix.target }}"
          bin="mar"
          [[ "${{ matrix.target }}" == *windows* ]] && bin="mar.exe"

          mkdir -p "dist" "stage/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "stage/${name}/"
          cp README.md README.ru.md "stage/${name}/"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            ( cd stage && 7z a "../dist/${name}.zip" "${name}" )
          else
            tar -czf "dist/${name}.tar.gz" -C stage "${name}"
          fi

          ( cd dist && (shasum -a 256 * || sha256sum *) > "${name}.sha256" )

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
