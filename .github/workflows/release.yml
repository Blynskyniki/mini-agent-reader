name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.1.0'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: mar-cli/browser-tls
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            # Cross-compiling needs the matching linker and C toolchain, since
            # QuickJS is C. BoringSSL is not cross-compiled here, so this
            # artifact speaks rustls' handshake.
            cross: true
            features: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            features: mar-cli/browser-tls
          - target: aarch64-apple-darwin
            os: macos-latest
            features: mar-cli/browser-tls
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: mar-cli/browser-tls

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # BoringSSL's assembly is assembled by NASM on Windows; the other
      # runners have cmake and a C++ compiler already.
      - name: Install NASM
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --bin mar ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mar dist/
          cp README.md README.en.md LICENSE dist/ 2>/dev/null || true
          tar -czf mar-${{ matrix.target }}.tar.gz -C dist .
          shasum -a 256 mar-${{ matrix.target }}.tar.gz > mar-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mar.exe dist/
          cp README.md README.en.md LICENSE dist/ 2>/dev/null || true
          # tar ships with Windows and produces the archive the npm installer
          # expects, so one format covers every platform.
          tar -czf mar-${{ matrix.target }}.tar.gz -C dist .
          certutil -hashfile mar-${{ matrix.target }}.tar.gz SHA256 | sed -n 2p > mar-${{ matrix.target }}.tar.gz.sha256

      - name: Check the binary runs
        if: "!matrix.cross"
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/mar
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" certs

      - uses: actions/upload-artifact@v4
        with:
          name: mar-${{ matrix.target }}
          path: |
            mar-${{ matrix.target }}.tar.gz
            mar-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the checksums
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          body: |
            Prebuilt `mar` binaries for Linux, macOS and Windows.

            Download the archive for your platform, unpack it, and run `mar`.
            Checksums are in `SHA256SUMS`.

            ```bash
            npm install mini-agent-reader
            ```

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    # Only for a real tag: a manual run should not publish a package version
    # that has no release behind it.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Match the package version to the tag
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cp ../README.md .

      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
