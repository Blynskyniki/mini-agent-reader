[workspace]
resolver = "3"
members = ["crates/mar-dom", "crates/mar-js", "crates/mar-net", "crates/mar-extract", "crates/mar-cdp", "crates/mar-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
html5ever = "0.39"
markup5ever = "0.39"
web_atoms = "0.2"
tendril = "0.5"
selectors = "0.40"
cssparser = "0.37"
string_cache = "0.11"
anyhow = "1"
# `disable-assertions` compiles out QuickJS's internal `assert()`s. One of
# them fires when the runtime is freed with a JS object still referenced,
# and a single leaked value anywhere in the engine then aborts the process.
# For a batch renderer that is the wrong trade: a leak on one page must not
# take the other five hundred with it.
rquickjs = { version = "0.12", features = ["macro", "classes", "properties", "array-buffer", "loader", "disable-assertions"] }
mar-dom = { path = "crates/mar-dom" }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mar-js = { path = "crates/mar-js" }
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip", "brotli", "cookies", "socks-proxy"] }
encoding_rs = "0.8"
webpki-roots = "1"
tracing = "0.1"
mar-net = { path = "crates/mar-net" }
mar-extract = { path = "crates/mar-extract" }
clap = { version = "4.6", features = ["derive", "env"] }
tiny_http = "0.12"
mar-cdp = { path = "crates/mar-cdp" }
tungstenite = "0.30"
sha1 = "0.11"
base64 = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# QuickJS with one parser change: `for (f() in o)` parses, as it does in V8,
# and throws at run time instead. See vendor/rquickjs-sys/README-mar.md.
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
